version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: claims-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: claims-backend
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever USE_DB is set to in .env so this compose file
      # always runs against the Mongo container above.
      USE_DB: "true"
      MONGO_URI: "mongodb://mongo:27017/claims_management"
    depends_on:
      - mongo
    # No published ports: the only way in is through the Nginx gateway below.
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    container_name: claims-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  # --- Monitoring stack (Story 5) ---------------------------------------
  # Prometheus scrapes GET /metrics on the backend every 15s (see
  # monitoring/prometheus.yml) and Grafana visualizes it. Neither is
  # routed through the Nginx gateway; reach them directly on their own
  # ports, same as Mongo above.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: claims-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: claims-grafana
    ports:
      - "3001:3000"
    environment:
      # Demo-only convenience login; change before any real deployment.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
